[pytest]
# rootdir = scripts/python (ce fichier). `pythonpath = .` rend `engine`,
# `rl_collect_batch`, `gameconfig`, … importables comme depuis les harnais.
pythonpath = .
testpaths = tests
# importlib : modules de test importés par chemin → l'arbo tests/ MIROIRE engine/
# (structure 1:1) sans __init__.py ni basenames uniques.
addopts = -ra --import-mode=importlib --strict-markers
# La suite SE CONFRONTE TOUJOURS AU LIVE (oracle = moteur natif en cours
# d'exécution) : pas de fixtures gelées. Sans session Frida chaude, les tests
# SKIPPENT proprement (cf. tests/conftest.py : live_session / live_runner).
# Indépendant de la version (lit l'état live) et du seed (assertions génériques).
